#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "mobilizon"
name = "Mobilizon"
description.en = "Decentralized and federated platform to organize events"
description.fr = "Plateforme décentralisée et fédérée pour organiser des événements"

version = "5.2.4~ynh1"

maintainers = ["rodinux"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://joinmobilizon.org/"
demo = "https://demo.mobilizon.org"
userdoc = "https://docs.joinmobilizon.org"
code = "https://framagit.org/kaihuri/mobilizon/"
fund = "https://soutenir.framasoft.org/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = true
sso = true

disk = "200M"
ram.build = "700M"
ram.runtime = "400M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

[resources]
    [resources.sources.main]
    prefetch = false
    amd64.url = "https://packages.mobilizon.org/5.2.4/mobilizon_5.2.4_debian-bookworm_amd64.tar.gz"
    amd64.sha256 = "c77b276e18fb3d79f35c4ca6d976e9c6fed5548d98e60b6dfd5c1aada8a107e7"
    arm64.url = "https://packages.mobilizon.org/5.2.4/mobilizon_5.2.4_debian-bookworm_arm64.tar.gz"
    amd64.sha256 = "83eec284b510b3aa662fd07f3c152887cf1f4847807a688d7537aee2f748051a"

    [resources.system_user]

    [resources.install_dir]
    owner = "__APP__:rwx"
    group = "www-data:r-x"

    [resources.data_dir]
    subdirs = ["uploads"]
    owner = "__APP__:rwx"
    group = "__APP__:rwx"

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8095

    [resources.apt]
    packages = [
        "postgresql",
        "postgresql-client",
        "postgresql-contrib",
        "postgis",
        "postgresql-postgis-scripts",
        "postgresql-postgis",
        "argon2",
        "imagemagick",
        "webp",
        "gifsicle",
        "jpegoptim",
        "optipng",
        "pngquant",
        "file",
    ]

    [resources.database]
    type = "postgresql"
