version = "1.0"

[main]

    ############################################################################
    #### ABOUT SECTIONS
    ############################################################################

    [main.config]

    name = "Configuration languages spoken in this instance"

    ## (optional) This help properties is a short help displayed on the same line

    optional = true

    [main.config.language]
        ask = "Main languages spoken by you/your moderators"
        help = "language codes from “ISO-639”: https://en.wikipedia.org/wiki/List_of_ISO_639_language_codes"
        type = "tags"
        choices = ['"ar"','"be"','"ca"','"cs"','"de"','"en"','"es"','"fi"','"fr"','"gd"','"gl"','"he"','"hr"','"hu"','"id"','"it"','"ja"','"ko"','"lt"','"nb"','"nl"','"nn"','"oc"','"pl"','"pt"','"ru"','"sv"','"tr"','"zh"']
        default = '"fr"'